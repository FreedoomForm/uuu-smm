name: Android APK

# Builds the ADposter Android app (Capacitor WebView -> adposter.vercel.app).
# - workflow_dispatch: manual run from the Actions tab (artifact only)
# - tag push v*: build + sign + attach APK to a GitHub Release
# Signing requires repo secrets:
#   ANDROID_KEYSTORE_BASE64 (PKCS12 keystore, base64)
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/adposter-keystore.p12"
          OUT=mobile/android/app/build/outputs/apk/release
          "$BT/zipalign" -f -p 4 "$OUT/app-release-unsigned.apk" "$OUT/app-release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/adposter-keystore.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out ADposter.apk "$OUT/app-release-aligned.apk"
          "$BT/apksigner" verify --print-certs ADposter.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADposter-apk
          path: ADposter.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ADposter.apk
          fail_on_unmatched_files: true
